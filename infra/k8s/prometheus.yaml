global:
  scrape_interval: 15s
  evaluation_interval: 15s

# Alerting configuration (for Alertmanager if needed)
alerting:
  alertmanagers: []

# Rule files for recording rules
rule_files: []

scrape_configs:
  # API Gateway
  - job_name: api
    static_configs:
      - targets: ["api:8000"]
    metrics_path: /metrics
    scrape_interval: 15s

  # Inference Service
  - job_name: inference
    static_configs:
      - targets: ["inference:8080"]
    metrics_path: /metrics
    scrape_interval: 15s

  # Training Service
  - job_name: training
    static_configs:
      - targets: ["training:8001"]
    metrics_path: /metrics
    scrape_interval: 30s

  # MLflow (basic metrics if available)
  - job_name: mlflow
    static_configs:
      - targets: ["mlflow:5000"]
    metrics_path: /metrics
    scrape_interval: 30s
    # MLflow may not expose /metrics, so allow scrape failures
    honor_labels: true

  # Prometheus self-monitoring
  - job_name: prometheus
    static_configs:
      - targets: ["localhost:9090"]
    scrape_interval: 30s
