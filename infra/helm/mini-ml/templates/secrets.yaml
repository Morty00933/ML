  # DO NOT commit real secrets to version control
  ADMIN_API_KEY: "REPLACE_ME"
  ENGINEER_API_KEY: "REPLACE_ME"
  VIEWER_API_KEY: "REPLACE_ME"
  AWS_ACCESS_KEY_ID: "REPLACE_ME"
  AWS_SECRET_ACCESS_KEY: "REPLACE_ME"
---
apiVersion: v1
kind: Secret
metadata:
  name: {{ .Values.inference.secretName }}
  labels:
    app.kubernetes.io/name: mini-ml
    app.kubernetes.io/instance: {{ .Release.Name }}
type: Opaque
stringData:
  AWS_ACCESS_KEY_ID: "REPLACE_ME"
  AWS_SECRET_ACCESS_KEY: "REPLACE_ME"
