{{- /*
IMPORTANT: This is a template showing the structure of required secrets.
Do NOT store real secrets in this file or commit them to version control.

Create secrets manually or use external secret management:
  kubectl create secret generic mini-ml-api-secrets \
    --from-literal=ADMIN_API_KEY=<your-admin-key> \
    --from-literal=ENGINEER_API_KEY=<your-engineer-key> \
    --from-literal=VIEWER_API_KEY=<your-viewer-key> \
    --from-literal=AWS_ACCESS_KEY_ID=<your-key> \
    --from-literal=AWS_SECRET_ACCESS_KEY=<your-secret>

Or use External Secrets Operator with AWS Secrets Manager, HashiCorp Vault, etc.
*/ -}}
